<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HappyFarm · Nông trại vui vẻ</title>
  </head>
  <body>
    <main>
      <h1 class="sr-only">HappyFarm · Nông trại vui vẻ</h1>
      <section class="field" aria-label="Nông trại">
        <div id="game"></div>
        <div class="meters" aria-label="Thông tin nông trại">
          <div class="profile">
            <img src="/face/1-1.GIF" alt="">
            <span>Khách</span>
          </div>
          <div class="balance">
            <div class="gauge">
              <label for="xp-bar" id="xp">0/200 XP</label>
              <progress id="xp-bar" max="200" value="0"></progress>
            </div>
            <span class="gold">Xu <strong id="coins">—</strong></span>
          </div>
          <span class="level" aria-label="Cấp hiện tại"><strong id="level">—</strong></span>
          <div class="gauge field-gauge">
            <label for="field-bar" id="field-count">0/6 ô đã gieo</label>
            <progress id="field-bar" max="6" value="0"></progress>
          </div>
        </div>
        <div id="plot-targets" class="plot-targets"></div>
        <nav class="tools" aria-label="Công cụ nông trại">
          <button type="button" data-tool="theme" disabled><img src="/icon/topbutton%20(10).png" alt="">Đổi nền</button>
          <button type="button" data-tool="shop" disabled><img src="/icon/topbutton%20(2).png" alt="">Tiệm hạt</button>
          <button type="button" data-tool="warehouse" disabled><img src="/icon/topbutton%20(8).png" alt="">Kho</button>
          <button type="button" data-tool="bag" disabled><img src="/icon/topbutton%20(12).png" alt="">Túi hạt</button>
          <button type="button" data-tool="clear" aria-pressed="false" disabled><img src="/icon/topbutton%20(6).png" alt="">Xẻng</button>
          <button type="button" data-tool="harvest" aria-pressed="false" disabled><img src="/icon/topbutton%20(4).png" alt="">Thu hoạch</button>
        </nav>
        <div class="instructions">
          <p id="hint">Đang mở nông trại…</p>
          <p id="feedback" role="status"></p>
        </div>
      </section>
    </main>

    <dialog id="inventory" aria-labelledby="inventory-title">
      <header class="inventory-header">
        <div class="inventory-heading">
          <img id="inventory-icon" src="/icon/topbutton%20(2).png" alt="">
          <div>
            <h2 id="inventory-title"></h2>
            <p id="inventory-description"></p>
          </div>
        </div>
        <span class="wallet"><span class="coin" aria-hidden="true"></span><strong id="inventory-coins">—</strong> xu</span>
        <form method="dialog"><button class="inventory-close" type="submit" aria-label="Đóng cửa sổ" autofocus>×</button></form>
      </header>
      <nav class="inventory-nav" aria-label="Tiệm và kho">
        <button type="button" data-panel="shop" aria-pressed="true">Tiệm hạt</button>
        <button type="button" data-panel="bag" aria-pressed="false">Túi hạt</button>
        <button type="button" data-panel="warehouse" aria-pressed="false">Kho nông sản</button>
      </nav>
      <div id="inventory-content"></div>
      <p id="panel-feedback" role="status"></p>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
