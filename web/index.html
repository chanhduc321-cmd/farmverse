<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FarmVerse</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1b261b;
        color: #f5f2e9;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        padding: 10px;
      }
      #game-container {
        width: 100%;
        max-width: 800px;
        aspect-ratio: 4 / 3;
        max-height: 95vh;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
        border-radius: 8px;
        overflow: hidden;
        background: #2f482d;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-container canvas {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
