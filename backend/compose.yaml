name: farmverse

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: farmverse
      POSTGRES_USER: farmverse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "farmverse", "-d", "farmverse"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  postgres-data:
