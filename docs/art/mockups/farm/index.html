<!doctype html>
<!--
  Terrain concept generated with built-in ImageGen from docs/art/approved_style.png.
  Original T-14 sprites are layered separately. The terrain is for review only.

  Use case: stylized-concept. Create ONE environment BACKPLATE only for a 2.5D isometric browser farming game mockup, using the attached approved FarmVerse art as style and material reference. Compose a single broad continuous raised grassy parcel floating in a bright blue sky with distant soft clouds, with textured earth cutaway and small embedded rocks. Classic fixed 2:1 dimetric near-symmetrical rounded diamond footprint, warm light from upper left, lush emerald-lime grass. Landscape 4:3 or 3:2, island very large, entire island visible; target silhouette grass corners around image coordinates back (50%,10%), left (4%,41%), right (96%,41%), front (50%,75%); cutaway reaches (50%,88%). The entire center of the grassy top must be completely empty, flat and clean with only subtle grassy texture, in order to overlay six interactive crop-bed PNGs. Leave all upper central grass clean to overlay an existing farmhouse and silo, and leave a left-side lawn for the existing pond sprite. Add a narrow natural pale golden cobblestone path framing the RIGHT EDGE of the grass from about (60%,24%) via (86%,40%) to (56%,69%), with a short branch toward the rear lawn and a short front-side connection toward the pond, preserving the broad central lawn. Add tiny grass tufts and small flower groups along just the outer edges, keep the lawn open. Elegant Farmery / Hay Day art, hand-painted stylized volume and depth, crisp at 400px display. NO building, silo, water pond, crop, plots, fence, trees, people, animal, text, panels, buttons or UI of any kind: those layers are added separately from approved sprites. Keep the background and island both fully opaque, no transparency. This is the terrain layer, not a completed farm composition.
-->
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FarmVerse · Mockup Farm</title>
  <style>
    :root {
      font-family: 'Segoe UI', sans-serif;
      color: #382713;
      background: #b6e8fc;
      --green: #215834;
      --cream: #fff6d8;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    img { display: block; }
    .farm {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100svh;
      overflow: hidden;
      background: linear-gradient(#75cef3 0%, #c5efff 32%, #80d9f5 66%, #c8f0fe 100%);
    }
    .topbar, .bottom {
      z-index: 2;
      width: min(100% - 64px, 1120px);
      margin-inline: auto;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding-top: 22px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 42px; height: 42px; object-fit: contain; }
    .brand p { margin: 0 0 2px; color: #255840; font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font: bold 32px/1 Georgia, serif; letter-spacing: -.035em; }
    .meters { display: flex; gap: 8px; }
    .meter {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 6px 12px;
      border: 1px solid #dfc392;
      border-radius: 14px;
      background: #fff6dc;
      box-shadow: 0 3px 0 #92784645;
      white-space: nowrap;
      font-size: 13px;
    }
    .meter img { width: 24px; height: 24px; object-fit: contain; }
    .meter small { margin-left: 3px; color: #604a28; font-size: 11px; }
    .world {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
      margin-top: -68px;
      margin-bottom: -35px;
    }
    .map {
      position: relative;
      container-type: inline-size;
      width: min(100%, 1060px, 139svh);
      aspect-ratio: 3 / 2;
    }
    .land {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      mask-image: linear-gradient(90deg, transparent, black 4%, black 96%, transparent), linear-gradient(0deg, transparent, black 4%, black 95%, transparent);
      mask-composite: intersect;
    }
    .prop, .plot, .marker { position: absolute; left: var(--x); top: var(--y); }
    .prop, .plot img { width: var(--w); height: auto; }
    .prop { transform: translate(-50%, var(--anchor, -85%)); }
    .plot { z-index: 1; width: var(--w); }
    .plot img { width: 100%; transform: translate(-50%, var(--anchor, -70%)); }
    .marker {
      z-index: 2;
      transform: translate(-50%, -50%);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      border: 1px solid #fff5ca;
      border-radius: 8px;
      background: #2c552d;
      color: #fff9dd;
      box-shadow: 0 2px 5px #241b1360;
      font-size: clamp(10px, 1.35cqw, 14px);
      line-height: 1.15;
      font-weight: 750;
      white-space: nowrap;
    }
    .marker.ready { color: #43270d; background: #ffe18c; border-color: #fff4c7; }
    .marker.locked { background: #52371e; }
    .marker img { width: 14px; height: 14px; object-fit: contain; }
    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 14px;
      padding-bottom: 22px;
    }
    .guide { margin: 0; color: #2a4e3c; font-size: 13px; font-weight: 650; }
    .actions { display: flex; align-items: center; gap: 8px; }
    .action {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 50px;
      padding: 8px 12px;
      border: 1px solid #d8b574;
      border-radius: 12px;
      background: var(--cream);
      box-shadow: 0 3px 0 #89693a60;
      font-size: 13px;
      font-weight: 750;
      line-height: 1.13;
    }
    .action img { width: 28px; height: 28px; object-fit: contain; }
    .action small { display: block; margin-top: 3px; color: #724316; font-size: 11px; }
    .shop { padding-inline: 15px; border-color: #45834c; background: var(--green); color: #fffae1; }
    .shop img { width: 25px; height: 25px; }
    @media (max-width: 620px) {
      .farm { background: linear-gradient(#85d3f4, #65c7f4 28%, #62c7f5 56%, #bdebf8 87%); }
      .topbar, .bottom { width: calc(100% - 28px); }
      .topbar { flex-direction: column; align-items: stretch; gap: 13px; padding-top: 18px; }
      .brand img { width: 38px; height: 38px; }
      h1 { font-size: 30px; }
      .meters { display: grid; grid-template-columns: auto 1fr; }
      .meter { padding-inline: 8px; min-height: 40px; }
      .meter small { margin-left: auto; }
      .world { margin-block: 0; }
      .map { width: min(100%, 620px); }
      .land { mask-image: linear-gradient(90deg, transparent, black 3%, black 97%, transparent), linear-gradient(0deg, transparent, black 7%, black 89%, transparent); }
      .marker { padding: 4px 6px; }
      .marker img { width: 12px; height: 12px; }
      .bottom { align-items: stretch; flex-direction: column; gap: 10px; padding-bottom: 18px; }
      .guide { text-align: center; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; }
      .shop { grid-column: 1 / -1; justify-content: center; }
    }
  </style>
</head>
<body>
  <main class="farm" aria-label="Mockup tĩnh của FarmVerse ở giữa phiên chơi">
    <header class="topbar">
      <div class="brand">
        <img src="../../../../web/public/assets/crop_normal.png" alt="">
        <div><p>FarmVerse</p><h1>Nông trại của tôi</h1></div>
      </div>
      <div class="meters" aria-label="Tài sản của người chơi">
        <div class="meter"><img src="../../../../web/public/assets/coin_gold.png" alt=""><b>20 GOLD</b></div>
        <div class="meter"><img src="../../../../web/public/assets/hud_silo_icon.png" alt=""><b>Silo 3/10</b><small>2 thường · 1 vàng</small></div>
      </div>
    </header>

    <section class="world" aria-label="Nông trại với sáu ô đất">
      <div class="map">
        <img class="land" src="terrain.png" alt="Nền cỏ isometric liền mạch và đường đá">
        <img class="prop" style="--x: 41%; --y: 31%; --w: 20%" src="../../../../web/public/assets/farmhouse_tier1.png" alt="Nhà nông trại">
        <img class="prop" style="--x: 57%; --y: 30%; --w: 10%" src="../../../../web/public/assets/silo_tier1.png" alt="Silo">
        <img class="prop" style="--x: 23%; --y: 51%; --w: 17%; --anchor: -70%" src="../../../../web/public/assets/fish_pond.png" alt="Ao cá">

        <div class="plot" style="--x: 35%; --y: 44%; --w: 14%; --anchor: -75%"><img src="../../../../web/public/assets/plot_ready_normal.png" alt="Ô 1, sẵn sàng thu hoạch"></div>
        <div class="plot" style="--x: 46%; --y: 52%; --w: 14%"><img src="../../../../web/public/assets/plot_empty.png" alt="Ô 2, đất trống"></div>
        <div class="plot" style="--x: 57%; --y: 60%; --w: 14%"><img src="../../../../web/public/assets/plot_locked.png" alt="Ô 3, mở với 20 GOLD"></div>
        <div class="plot" style="--x: 49%; --y: 36%; --w: 14%"><img src="../../../../web/public/assets/plot_locked.png" alt="Ô 4, đang khóa"></div>
        <div class="plot" style="--x: 60%; --y: 44%; --w: 14%"><img src="../../../../web/public/assets/plot_locked.png" alt="Ô 5, đang khóa"></div>
        <div class="plot" style="--x: 71%; --y: 52%; --w: 14%"><img src="../../../../web/public/assets/plot_locked.png" alt="Ô 6, đang khóa"></div>

        <img class="prop" style="--x: 33%; --y: 58%; --w: 14%; --anchor: -70%" src="../../../../web/public/assets/fence_open.png" alt="Hàng rào ở lối đi bên ao">
        <img class="prop" style="--x: 72%; --y: 64%; --w: 13%; --anchor: -70%" src="../../../../web/public/assets/fence_locked.png" alt="Hàng rào khu mở rộng">

        <span class="marker ready" style="--x: 35%; --y: 48%">Thu hoạch</span>
        <span class="marker" style="--x: 46%; --y: 56%">Gieo hạt</span>
        <span class="marker locked" style="--x: 57%; --y: 64%"><img src="../../../../web/public/assets/icon_lock.png" alt="">Mở · 20 G</span>
      </div>
    </section>

    <footer class="bottom">
      <p class="guide">Chạm vào ô đất để gieo hạt hoặc thu hoạch.</p>
      <div class="actions" aria-label="Các nút trong bản duyệt">
        <div class="action"><img src="../../../../web/public/assets/crop_normal.png" alt=""><span>Bán lúa thường<small>+10 GOLD</small></span></div>
        <div class="action"><img src="../../../../web/public/assets/crop_golden.png" alt=""><span>Bán lúa vàng<small>+30 GOLD</small></span></div>
        <div class="action shop"><img src="../../../../web/public/assets/hud_cart_icon.png" alt="">Đến Cửa Hàng&nbsp; →</div>
      </div>
    </footer>
  </main>
</body>
</html>
